name: Build Flutter APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'
        cache: true

    - name: Create fresh Flutter project structure
      run: |
        flutter create . --org com.moshoura.sebha --project-name sebha_app --force

    - name: Replace main.dart with custom code
      run: |
        # التأكد من وضع الكود الخاص بك في مكانه الصحيح تلقائياً
        # (أو يمكنك التأكد من أن ملف lib/main.dart يدوياً يحتوي على الكود)

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
