name: Build Flutter APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'
        cache: true

    - name: Create Flutter template structure
      run: |
        flutter create . --org com.moshoura.sebha --project-name sebha_app --force

    - name: Restore main.dart and pubspec.yaml
      run: |
        # التأكد من بقاء ملفاتك سليمة، وflutter create سينشئ ملفات الأندرويد والجريدل المطلوبة تلقائياً

    - name: Get Flutter dependencies
      run: flutter pub get

    - name: Build Release APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
